<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall of Fame | Squared Circle Tycoon</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { DEFAULT: '#f59e0b', hover: '#d97706' }, studio: '#111827', background: '#030712' } } }
        }
    </script>
</head>
<body class="bg-background text-slate-300 font-sans antialiased flex flex-col min-h-screen">

    <nav class="border-b border-slate-800 bg-background/95 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex-shrink-0 flex items-center gap-3">
                    <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition">
                        <img src="assets/images/teminal-logo.jpg" alt="Squared Circle Logo" class="h-12 w-auto rounded">
                        <span class="text-white font-bold text-xl tracking-tight hidden sm:block">SQUARED CIRCLE <span class="text-brand">WRESTLING</span></span>
                    </a>
                </div>
                <div>
                    <a href="index.html" class="text-sm font-medium hover:text-white transition px-3 py-2">Home</a>
                    <a href="squared-circle-tycoon.html" class="text-sm font-medium text-brand px-3 py-2">Games</a>
                    <a href="about.html" class="text-sm font-medium hover:text-white transition px-3 py-2">About</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="bg-studio border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex space-x-8 overflow-x-auto">
                <a href="squared-circle-tycoon.html" class="border-transparent text-slate-400 hover:text-white hover:border-slate-500 border-b-2 py-4 px-1 text-sm font-medium transition whitespace-nowrap">Game Info</a>
                <a href="mods.html" class="border-transparent text-slate-400 hover:text-white hover:border-slate-500 border-b-2 py-4 px-1 text-sm font-medium transition whitespace-nowrap">Community Mods</a>
                <a href="leaderboard.html" class="border-brand text-brand border-b-2 py-4 px-1 text-sm font-bold whitespace-nowrap">Hall of Fame</a>
            </div>
        </div>
    </div>

    <main class="flex-grow py-16">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-12">
                <h1 class="text-3xl md:text-5xl font-black text-white uppercase tracking-wider mb-4 flex items-center justify-center gap-4">
                    🏆 Hall of Fame
                </h1>
                <p class="text-slate-400 text-lg">Live Auto-Sync Global Rankings</p>
            </div>
            
            <div class="bg-studio rounded-xl border border-slate-700 overflow-hidden shadow-2xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-900 border-b border-slate-700">
                                <th class="py-5 px-6 text-brand font-bold uppercase text-sm tracking-wider">Rank</th>
                                <th class="py-5 px-6 text-brand font-bold uppercase text-sm tracking-wider">Promoter / Promotion</th>
                                <th class="py-5 px-6 text-brand font-bold uppercase text-sm tracking-wider">In-Game Time</th>
                                <th class="py-5 px-6 text-brand font-bold uppercase text-sm tracking-wider text-right">Legacy Score</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body" class="divide-y divide-slate-800">
                            <tr>
                                <td colspan="4" class="py-12 text-center text-slate-500 animate-pulse text-lg">Syncing with Global Network...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-background py-10 border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center text-sm text-slate-500">
            <div class="mb-6 md:mb-0 flex items-center gap-2">
                <img src="assets/images/teminal-logo.jpg" alt="Icon" class="h-6 w-auto grayscale opacity-50 rounded">
                &copy; 2026 Squared Circle Wrestling. All rights reserved.
            </div>
        </div>
    </footer>

    <script>
        // REPLACE THESE WITH YOUR ACTUAL KEYS FROM .env
        const supabaseUrl = 'YOUR_SUPABASE_URL_HERE';
        const supabaseKey = 'YOUR_SUPABASE_ANON_KEY_HERE';
        const supabase = supabaseCreateClient(supabaseUrl, supabaseKey);

        async function fetchLeaderboard() {
            try {
                const { data, error } = await supabase
                    .from('leaderboard')
                    .select('promoter_name, current_year, current_week, total_score')
                    .order('total_score', { ascending: false })
                    .limit(50);

                if (error) throw error;

                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = ''; 

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="py-8 text-center text-slate-500">No data available yet. Be the first to chart!</td></tr>';
                    return;
                }

                data.forEach((player, index) => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-800/50 transition-colors duration-150';
                    
                    const isFirst = index === 0;
                    const rankColor = isFirst ? 'text-brand font-black text-xl' : 'text-slate-400 font-bold';
                    const nameColor = isFirst ? 'text-white font-bold text-lg' : 'text-slate-300';
                    const scoreColor = isFirst ? 'text-brand font-bold text-lg' : 'text-slate-300 font-medium';

                    const formattedScore = player.total_score.toLocaleString();

                    row.innerHTML = `
                        <td class="py-5 px-6 ${rankColor}">#${index + 1}</td>
                        <td class="py-5 px-6 ${nameColor}">${player.promoter_name}</td>
                        <td class="py-5 px-6 text-slate-400 text-sm">Year ${player.current_year}, Week ${player.current_week}</td>
                        <td class="py-5 px-6 ${scoreColor} text-right">${formattedScore}</td>
                    `;
                    tbody.appendChild(row);
                });

            } catch (error) {
                console.error('Leaderboard Sync Error:', error);
                document.getElementById('leaderboard-body').innerHTML = 
                    '<tr><td colspan="4" class="py-8 text-center text-red-500">Database connection offline.</td></tr>';
            }
        }
        window.addEventListener('DOMContentLoaded', fetchLeaderboard);
    </script>
</body>
</html>
