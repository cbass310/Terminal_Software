<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal AI | Deep Search</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    
    <meta name="robots" content="noindex, nofollow">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,900&family=Inter:wght@400;500;600;700&family=Oswald:wght@700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7950419700899075" crossorigin="anonymous"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/dashboard.css">

    <script>
        // Official Terminal Software Tailwind Config
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#f59e0b', hover: '#d97706' },
                        studio: '#0f172a',
                        background: '#020617',
                        cyanAccent: '#06b6d4',
                        redAccent: '#ef4444',
                        void: '#0A0A0A',
                        neon: '#39FF14',
                    },
                    fontFamily: {
                        heading: ['Montserrat', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                        impact: ['Oswald', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Hide scrollbar for a cleaner terminal look */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .scanline {
            width: 100%;
            height: 100px;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(6, 182, 212, 0.05) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            position: fixed;
            bottom: 100%;
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .cursor-blink { animation: blink 1s step-end infinite; }
        
        .sys-log {
            color: #06b6d4;
            text-shadow: 0 0 5px rgba(6, 182, 212, 0.4);
        }
        
        /* Ensures the chat area pushes the footer down properly */
        #chat-container {
            min-height: 60vh;
        }

        /* Ad Container Glitch/Border Effects */
        .ad-terminal-bracket {
            position: relative;
            background-color: #000000;
        }
        .ad-terminal-bracket::before,
        .ad-terminal-bracket::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border: 1px solid rgba(6, 182, 212, 0.5); /* cyanAccent fallback */
            pointer-events: none;
        }
        .ad-terminal-bracket::before {
            top: 0; left: 0;
            border-right: none; border-bottom: none;
        }
        .ad-terminal-bracket::after {
            bottom: 0; right: 0;
            border-left: none; border-top: none;
        }
    </style>
</head>
<body class="text-slate-300 font-sans min-h-screen flex flex-col selection:bg-neon selection:text-void overflow-x-hidden relative bg-background">

    <div id="ambient-bg" class="fixed top-0 left-1/4 w-[800px] h-[600px] bg-[radial-gradient(circle_at_center,rgba(6,182,212,0.05)_0%,transparent_60%)] rounded-full pointer-events-none -z-10"></div>
    <div class="scanline"></div>

    <nav id="global-nav" class="bg-background/80 backdrop-blur-md sticky top-0 z-50 border-b border-white/10"></nav>

    <div class="w-full bg-[#020617] border-b border-white/5 py-3 px-4 relative z-40 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-col items-center justify-center">
            <div class="w-full flex justify-between items-end mb-1 max-w-[728px] mx-auto">
                <span class="text-[8px] font-mono text-cyanAccent/70 uppercase tracking-widest pl-2">SPONSORED_TELEMETRY</span>
                <span class="text-[8px] font-mono text-slate-600 uppercase pr-2">SYS.NET.ID: 0x99F</span>
            </div>
            <div class="ad-terminal-bracket w-full max-w-[728px] min-h-[90px] flex items-center justify-center border-y border-white/10 group hover:border-cyanAccent/30 transition-colors mx-auto">
                <ins class="adsbygoogle"
                     style="display:block; width:100%; text-align:center;"
                     data-ad-layout="in-article"
                     data-ad-format="fluid"
                     data-ad-client="ca-pub-7950419700899075"
                     data-ad-slot=""></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </div>
    </div>

    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative z-10 flex flex-col">
        
        <div class="flex items-center justify-between border-b border-white/10 pb-6 mb-6">
            <div class="flex items-center gap-4">
                <div class="w-3 h-3 bg-cyanAccent rounded-full animate-pulse shadow-[0_0_10px_rgba(6,182,212,0.6)]"></div>
                <h1 class="font-impact text-2xl sm:text-3xl font-black text-white uppercase tracking-widest">Terminal AI</h1>
            </div>
            <div class="text-[10px] text-cyanAccent uppercase font-bold tracking-widest border border-cyanAccent/30 px-3 py-1.5 rounded-lg bg-cyanAccent/10">
                Secure Uplink
            </div>
        </div>

        <div class="flex-grow bg-studio/30 border border-white/10 rounded-2xl shadow-[0_0_30px_rgba(0,0,0,0.5)] flex flex-col overflow-hidden relative backdrop-blur-sm mb-12">
            
            <div id="chat-container" class="flex-grow overflow-y-auto p-6 sm:p-8 flex flex-col gap-6 hide-scrollbar">
                <div class="text-slate-500 font-mono text-xs uppercase tracking-widest mb-4 border-l-2 border-cyanAccent/50 pl-4">
                    &gt; Initializing Master Terminal Node... [OK]<br>
                    &gt; Establishing DAAS Uplink... [OK]<br>
                    &gt; Awaiting Query.
                </div>
            </div>

            <div class="bg-studio/80 border-t border-white/10 p-4 shrink-0 relative">
                <div class="relative w-full max-w-4xl mx-auto">
                    <div class="absolute left-4 top-1/2 -translate-y-1/2 text-cyanAccent font-bold font-mono">&gt;</div>
                    <input type="text" id="query-input" 
                        class="w-full bg-background border border-white/20 rounded-xl py-4 pl-10 pr-16 text-white focus:outline-none focus:border-cyanAccent focus:ring-1 focus:ring-cyanAccent/50 transition-all shadow-[0_0_15px_rgba(0,0,0,0.3)] placeholder-slate-600 font-mono text-sm"
                        placeholder="Query sports props, crypto telemetry, or tycoon stats..."
                        autocomplete="off" spellcheck="false">
                    <button id="submit-btn" class="absolute right-3 top-1/2 -translate-y-1/2 bg-white/5 hover:bg-white/10 text-cyanAccent hover:text-white p-2.5 rounded-lg transition-colors focus:outline-none">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </div>
            
        </div>
    </main>

    <footer id="global-footer" class="bg-background py-12 border-t border-slate-800 mt-auto relative z-20"></footer>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/components.js"></script>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const queryInput = document.getElementById('query-input');
        const submitBtn = document.getElementById('submit-btn');

        // --- CORE CONFIGURATION ---
        const API_ENDPOINT = 'https://api.terminalsoftware.online/query'; 

        // Listen for Enter key or button click
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleQuery();
        });
        submitBtn.addEventListener('click', handleQuery);

        async function handleQuery() {
            const text = queryInput.value.trim();
            if (!text) return;

            // 1. Render User Message
            renderUserMessage(text);
            queryInput.value = '';
            queryInput.disabled = true;

            // 2. Render Loading Logs
            const logId = `log-${Date.now()}`;
            renderSystemLogs(logId);

            try {
                // 3. Hit the Backend API
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await response.json();

                // Remove loading logs
                document.getElementById(logId).remove();

                // 4. Route based on Intent
                if (data.status === "success" && data.node_response) {
                    routeResponse(data.intent, data.node_response);
                } else {
                    renderError("Invalid payload received from Master Node.");
                }

            } catch (error) {
                document.getElementById(logId).remove();
                renderError("CONNECTION SEVERED: Backend API unreachable. Verify DigitalOcean Firewall on Port 8000.");
            } finally {
                queryInput.disabled = false;
                queryInput.focus();
                scrollToBottom();
            }
        }

        // --- ROUTING LOGIC ---
        function routeResponse(intent, payload) {
            const wrapper = document.createElement('div');
            wrapper.className = 'w-full md:w-3/4 max-w-3xl self-start font-mono';
            let htmlContent = '';

            switch(intent) {
                case 'SPORTS':
                    htmlContent = `
                        <div class="bg-black/60 border border-brand/40 rounded-2xl p-6 shadow-[0_0_20px_rgba(245,158,11,0.1)] relative overflow-hidden">
                            <div class="absolute top-0 right-0 w-32 h-32 bg-brand/5 blur-3xl rounded-full pointer-events-none"></div>
                            <div class="flex items-center gap-3 mb-4 border-b border-white/10 pb-3 relative z-10">
                                <span class="text-brand text-xl">⚡</span>
                                <div>
                                    <h3 class="font-impact text-white uppercase tracking-widest text-xl leading-none">${payload.module}</h3>
                                </div>
                                <span class="ml-auto text-[9px] bg-brand/20 text-brand font-bold px-3 py-1 rounded border border-brand/30 uppercase tracking-widest">${payload.status}</span>
                            </div>
                            <div class="text-sm text-slate-300 typewriter-target leading-relaxed relative z-10" data-text="${payload.action} | ${payload.insights || 'Awaiting telemetry...'}"></div>
                        </div>
                    `;
                    break;
                case 'CRYPTO':
                    htmlContent = `
                        <div class="bg-black/60 border border-neon/40 rounded-2xl p-6 shadow-[0_0_20px_rgba(57,255,20,0.1)] relative overflow-hidden">
                            <div class="absolute top-0 right-0 w-32 h-32 bg-neon/5 blur-3xl rounded-full pointer-events-none"></div>
                            <div class="flex items-center gap-3 mb-4 border-b border-white/10 pb-3 relative z-10">
                                <span class="text-neon text-xl">🪙</span>
                                <div>
                                    <h3 class="font-impact text-white uppercase tracking-widest text-xl leading-none">${payload.module}</h3>
                                </div>
                                <span class="ml-auto text-[9px] bg-neon/20 text-neon font-bold px-3 py-1 rounded border border-neon/30 uppercase tracking-widest">${payload.status}</span>
                            </div>
                            <div class="text-sm text-slate-300 typewriter-target leading-relaxed relative z-10" data-text="${payload.action} | ${payload.insights || 'Awaiting telemetry...'}"></div>
                        </div>
                    `;
                    break;
                case 'TYCOON':
                    htmlContent = `
                        <div class="bg-[#1a1a1a] border border-white/10 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                            <div class="flex items-center gap-3 mb-4 border-b border-white/10 pb-3 relative z-10">
                                <span class="text-slate-400 text-xl">🏛️</span>
                                <div>
                                    <h3 class="font-impact text-white uppercase tracking-widest text-xl leading-none">${payload.module}</h3>
                                </div>
                                <span class="ml-auto text-[9px] bg-white/10 text-slate-300 font-bold px-3 py-1 rounded border border-white/20 uppercase tracking-widest">${payload.status}</span>
                            </div>
                            <div class="text-sm text-slate-300 typewriter-target leading-relaxed relative z-10" data-text="${payload.action}"></div>
                        </div>
                    `;
                    break;
                default:
                case 'GENERAL':
                    htmlContent = `
                        <div class="pl-5 border-l-2 border-cyanAccent/50 bg-cyanAccent/5 py-4 rounded-r-xl">
                            <div class="text-[10px] font-bold text-cyanAccent uppercase tracking-widest mb-2 flex items-center gap-2">
                                <span class="w-1.5 h-1.5 rounded-full bg-cyanAccent animate-pulse"></span>
                                Terminal AI Response
                            </div>
                            <div class="text-sm text-slate-300 typewriter-target leading-relaxed" data-text="${payload.response || payload.action}"></div>
                        </div>
                    `;
                    break;
            }

            wrapper.innerHTML = htmlContent;
            chatContainer.appendChild(wrapper);

            // Execute Typewriter Effect
            const target = wrapper.querySelector('.typewriter-target');
            if (target) {
                typeWriterEffect(target, target.getAttribute('data-text'), 15, () => {
                    // Trigger dynamic AdSense block after response
                    injectInlineAd();
                });
            } else {
                injectInlineAd();
                scrollToBottom();
            }
        }

        // --- INLINE ADSENSE INJECTION ENGINE ---
        function injectInlineAd() {
            const adWrapper = document.createElement('div');
            adWrapper.className = 'w-full md:w-3/4 max-w-3xl self-start font-mono opacity-0 transition-opacity duration-500 mt-2 bg-[#020617] p-3 rounded-2xl border border-white/5 shadow-xl';
            
            adWrapper.innerHTML = `
                <div class="flex justify-between items-end mb-2">
                    <span class="text-[8px] font-mono text-cyanAccent/70 uppercase tracking-widest pl-2 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-cyanAccent animate-pulse"></span> SPONSORED_TELEMETRY</span>
                    <span class="text-[8px] font-mono text-slate-600 uppercase pr-2">SYS.NET.ID: 0x${Math.floor(Math.random()*1000).toString(16).toUpperCase()}</span>
                </div>
                <div class="ad-terminal-bracket w-full min-h-[90px] flex items-center justify-center border border-white/5 bg-[#000000] rounded">
                    <ins class="adsbygoogle"
                         style="display:block; width:100%; text-align:center;"
                         data-ad-layout="in-article"
                         data-ad-format="fluid"
                         data-ad-client="ca-pub-7950419700899075"
                         data-ad-slot=""></ins>
                </div>
            `;
            
            chatContainer.appendChild(adWrapper);
            scrollToBottom();
            
            // Push to AdSense
            setTimeout(() => {
                try {
                    (window.adsbygoogle = window.adsbygoogle || []).push({});
                } catch(e) {
                    console.warn("AdSense push failed inside inline chat ad", e);
                }
            }, 100);

            // Smooth fade-in
            setTimeout(() => { adWrapper.classList.remove('opacity-0'); }, 50);
        }

        // --- UI RENDER HELPERS ---
        function renderUserMessage(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'w-full md:w-2/3 max-w-2xl self-end text-right mt-2';
            wrapper.innerHTML = `
                <div class="inline-block bg-white/10 border border-white/20 backdrop-blur-md rounded-2xl rounded-tr-sm px-5 py-3.5 text-sm text-white shadow-lg text-left font-mono">
                    ${escapeHtml(text)}
                </div>
            `;
            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function renderSystemLogs(id) {
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = 'w-full self-start pl-5 py-3 font-mono';
            wrapper.innerHTML = `
                <div class="text-[10px] font-bold sys-log uppercase tracking-widest leading-loose animate-pulse">
                    &gt; Intercepting query...<br>
                    &gt; Routing to Master Terminal Node...<br>
                    &gt; Synthesizing response<span class="cursor-blink">_</span>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function renderError(msg) {
            const wrapper = document.createElement('div');
            wrapper.className = 'w-full self-start pl-4 py-2 font-mono';
            wrapper.innerHTML = `<div class="text-xs text-red-500 font-bold uppercase tracking-widest border border-red-500/30 bg-red-500/10 p-4 rounded-xl shadow-[0_0_15px_rgba(239,68,68,0.2)]">&gt; ERROR: ${msg}</div>`;
            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function typeWriterEffect(element, text, speed = 15, callback = null) {
            element.innerHTML = '';
            let i = 0;
            element.innerHTML += '<span class="cursor-blink">_</span>';
            
            function type() {
                if (i < text.length) {
                    element.innerHTML = element.innerHTML.replace('<span class="cursor-blink">_</span>', '');
                    element.innerHTML += text.charAt(i) + '<span class="cursor-blink">_</span>';
                    i++;
                    scrollToBottom();
                    setTimeout(type, speed);
                } else {
                    setTimeout(() => {
                        element.innerHTML = element.innerHTML.replace('<span class="cursor-blink">_</span>', '');
                        if (callback) callback();
                    }, 1000);
                }
            }
            type();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(unsafe) {
            return String(unsafe).replace(/[&<"'>]/g, function (m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
