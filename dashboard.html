<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Dashboard | Terminal Software</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#0A0A0A',
                        neon: '#39FF14',
                    },
                    fontFamily: {
                        heading: ['Oswald', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    },
                    boxShadow: {
                        // Hard, unblurred offset shadows for the comic book print effect
                        'brutal-white': '6px 6px 0px 0px rgba(255,255,255,1)',
                        'brutal-neon': '4px 4px 0px 0px rgba(57,255,20,1)',
                    },
                    borderWidth: {
                        '3': '3px',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0A0A0A; }
        /* Custom scrollbar to fit the brutalist theme */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #0A0A0A; border-left: 3px solid white; }
        ::-webkit-scrollbar-thumb { background: white; }
    </style>
</head>
<body class="text-white font-mono min-h-screen flex flex-col selection:bg-neon selection:text-void overflow-x-hidden">

    <header class="border-b-3 border-white bg-void sticky top-0 z-50 py-4 px-6 md:px-12 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-6">
            <a href="portal.html" class="hover:text-neon transition-colors duration-200" title="Exit Dashboard">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="square" stroke-linejoin="miter" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" />
                </svg>
            </a>
            <h1 class="font-heading text-3xl md:text-4xl font-black uppercase tracking-widest text-white mt-1">
                TERMINAL SOFTWARE
            </h1>
        </div>
        
        <div class="flex items-center gap-3 border-3 border-white px-4 py-2 bg-void shadow-brutal-white">
            <div class="w-3 h-3 bg-neon animate-pulse"></div>
            <span class="font-bold text-neon text-sm tracking-widest uppercase">System Online</span>
        </div>
    </header>

    <main class="flex-grow max-w-6xl mx-auto w-full px-4 sm:px-6 py-12">
        
        <div class="flex justify-center mb-16">
            <div class="inline-flex border-3 border-white shadow-brutal-white bg-void">
                <button id="tab-retail" class="px-8 py-3 font-heading text-xl font-black tracking-widest uppercase transition-colors duration-200 bg-white text-void focus:outline-none">
                    Retail Feed
                </button>
                <div class="w-[3px] bg-white"></div>
                <button id="tab-api" class="px-8 py-3 font-heading text-xl font-black tracking-widest uppercase transition-colors duration-200 bg-void text-white hover:bg-white/10 focus:outline-none">
                    Developer API
                </button>
            </div>
        </div>

        <div id="view-retail" class="block w-full">
            <div id="loading-state" class="text-center py-20">
                <div class="inline-block w-12 h-12 border-4 border-white border-t-neon animate-spin mb-6"></div>
                <p class="font-bold text-neon uppercase tracking-widest animate-pulse">Fetching Telemetry...</p>
            </div>
            
            <div id="feed-container" class="space-y-10 hidden">
                </div>
        </div>

        <div id="view-api" class="hidden w-full">
            <div class="border-3 border-white bg-void p-12 text-center shadow-brutal-white">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-16 h-16 mx-auto mb-6 text-slate-500">
                    <path stroke-linecap="square" stroke-linejoin="miter" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5" />
                </svg>
                <h2 class="font-heading text-3xl font-black text-white mb-4 uppercase tracking-widest">Awaiting Telemetry Configuration</h2>
                <p class="text-slate-400 font-bold max-w-lg mx-auto leading-relaxed">
                    Institutional API keys are required to access raw JSON data streams. Visit the Developer Portal to manage your endpoints.
                </p>
                <a href="portal.html" class="inline-block mt-8 border-3 border-white px-8 py-3 font-bold uppercase tracking-widest hover:bg-white hover:text-void transition-colors duration-200">
                    Manage Keys
                </a>
            </div>
        </div>

    </main>

    <script>
        // --- TAB LOGIC ---
        const tabRetail = document.getElementById('tab-retail');
        const tabApi = document.getElementById('tab-api');
        const viewRetail = document.getElementById('view-retail');
        const viewApi = document.getElementById('view-api');

        function switchTab(isRetail) {
            if (isRetail) {
                tabRetail.classList.replace('bg-void', 'bg-white');
                tabRetail.classList.replace('text-white', 'text-void');
                tabRetail.classList.remove('hover:bg-white/10');
                
                tabApi.classList.replace('bg-white', 'bg-void');
                tabApi.classList.replace('text-void', 'text-white');
                tabApi.classList.add('hover:bg-white/10');

                viewRetail.classList.remove('hidden');
                viewApi.classList.add('hidden');
            } else {
                tabApi.classList.replace('bg-void', 'bg-white');
                tabApi.classList.replace('text-white', 'text-void');
                tabApi.classList.remove('hover:bg-white/10');
                
                tabRetail.classList.replace('bg-white', 'bg-void');
                tabRetail.classList.replace('text-void', 'text-white');
                tabRetail.classList.add('hover:bg-white/10');

                viewApi.classList.remove('hidden');
                viewRetail.classList.add('hidden');
            }
        }

        tabRetail.addEventListener('click', () => switchTab(true));
        tabApi.addEventListener('click', () => switchTab(false));

        // --- DATA FETCHING LOGIC ---
        const MOCK_DATA = [
            {
                "timestamp": "2026-04-17 08:30:00",
                "matchup": "Chicago Cubs vs Miami Marlins",
                "sport": "baseball_mlb",
                "market": "spreads",
                "target": "Chicago Cubs -2.5",
                "bookmaker": "BETANYSPORTS",
                "odds": 195.0,
                "edge": 8.70
            },
            {
                "timestamp": "2026-04-17 09:15:00",
                "matchup": "San Francisco Giants vs Washington Nationals",
                "sport": "baseball_mlb",
                "market": "h2h",
                "target": "San Francisco Giants ML",
                "bookmaker": "DRAFTKINGS",
                "odds": -130.0,
                "edge": 4.52
            }
        ];

        async function fetchLiveSignals() {
            try {
                // Try to hit the live local API
                const response = await fetch('http://localhost:8000/api/signals/live');
                if (!response.ok) throw new Error('API Offline');
                return await response.json();
            } catch (error) {
                console.warn('Live API unreachable. Falling back to Mock Data.');
                return MOCK_DATA;
            }
        }

        function createSniperCard(signal) {
            // Format edge to always show + and 2 decimals
            const edgeFormatted = `+${signal.edge.toFixed(2)}% EV`;
            
            return `
                <div class="border-3 border-white bg-void shadow-brutal-white p-6 sm:p-8 hover:translate-y-[2px] hover:translate-x-[2px] hover:shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] transition-all duration-150">
                    
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6 mb-8">
                        <h2 class="font-heading text-3xl sm:text-4xl font-black uppercase leading-none tracking-wide text-white">
                            ${signal.matchup}
                        </h2>
                        
                        <div class="border-3 border-neon bg-neon/10 px-4 py-2 shadow-brutal-neon whitespace-nowrap">
                            <span class="text-neon font-black text-xl tracking-widest">${edgeFormatted}</span>
                        </div>
                    </div>
                    
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-6 border-t-3 border-white/20 pt-6">
                        
                        <div class="space-y-2">
                            <div class="flex items-center gap-3">
                                <span class="text-slate-500 font-bold uppercase tracking-widest text-xs">Target:</span>
                                <span class="text-white font-bold text-lg uppercase">${signal.target}</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-slate-500 font-bold uppercase tracking-widest text-xs">Market:</span>
                                <span class="text-white font-bold text-sm uppercase">${signal.market}</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-slate-500 font-bold uppercase tracking-widest text-xs">Sport:</span>
                                <span class="text-white font-bold text-sm uppercase">${signal.sport.replace('_', ' ')}</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-slate-500 font-bold uppercase tracking-widest text-xs">Logged:</span>
                                <span class="text-slate-400 font-bold text-xs uppercase">${signal.timestamp}</span>
                            </div>
                        </div>

                        <div class="bg-white text-void border-3 border-white px-5 py-3 w-full sm:w-auto text-center">
                            <span class="font-heading font-black text-xl uppercase tracking-widest">
                                ${signal.bookmaker} @ ${signal.odds > 0 ? '+' + signal.odds : signal.odds}
                            </span>
                        </div>
                        
                    </div>
                </div>
            `;
        }

        async function initDashboard() {
            const container = document.getElementById('feed-container');
            const loader = document.getElementById('loading-state');
            
            // Artificial delay to show off the loading animation 
            await new Promise(resolve => setTimeout(resolve, 800));

            const data = await fetchLiveSignals();
            
            loader.classList.add('hidden');
            container.classList.remove('hidden');

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="border-3 border-white bg-void p-12 text-center border-dashed">
                        <p class="font-bold text-slate-500 uppercase tracking-widest">NO LIVE SIGNALS DETECTED IN MEMORY POOL.</p>
                    </div>
                `;
                return;
            }

            let htmlContent = '';
            data.forEach(signal => {
                htmlContent += createSniperCard(signal);
            });
            
            container.innerHTML = htmlContent;
        }

        // Boot system
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
