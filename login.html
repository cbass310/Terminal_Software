<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration | Terminal Software</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#f59e0b', hover: '#d97706' },
                        studio: '#0f172a',
                        background: '#020617',
                        cyanAccent: '#06b6d4',
                        neon: '#39FF14'
                    },
                    fontFamily: {
                        heading: ['Montserrat', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Login & Registration | Terminal Software",
      "description": "Secure authentication portal for Terminal Software. Login to access the live algorithmic sports betting matrix, +EV ledger, Arbitrage scanner, and crypto telemetry dashboard.",
      "publisher": {
        "@type": "Organization",
        "name": "Terminal Software",
        "url": "https://terminalsoftware.online"
      },
      "audience": {
        "@type": "Audience",
        "audienceType": "Quantitative Developers, Sports Bettors, Crypto Traders"
      }
    }
    </script>

    <script>
        // Initialize dataLayer
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}

        // Check for consent
        if (localStorage.getItem('terminal_cookie_consent') === 'granted') {
            loadGA4();
        }

        function loadGA4() {
            const script = document.createElement('script');
            script.src = 'https://www.googletagmanager.com/gtag/js?id=G-75T58KCS89'; 
            script.async = true;
            document.head.appendChild(script);

            gtag('js', new Date());
            gtag('config', 'G-75T58KCS89'); 
        }

        function acceptCookies() {
            localStorage.setItem('terminal_cookie_consent', 'granted');
            document.getElementById('cookie-banner').style.display = 'none';
            loadGA4();
        }
    </script>
</head>
<body class="bg-background text-slate-300 font-sans antialiased selection:bg-brand selection:text-background flex flex-col min-h-screen relative overflow-x-hidden">

    <div id="cookie-banner" class="fixed bottom-0 left-0 w-full bg-studio/95 backdrop-blur-xl border-t border-white/10 z-[100] p-4 sm:p-6 transform transition-transform duration-500 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]" style="display: none;">
        <div class="text-sm text-slate-300 font-medium">
            We use cookies and telemetry to analyze traffic and optimize your experience. <a href="privacy.html" class="text-cyanAccent hover:underline underline-offset-4">Learn more</a>.
        </div>
        <button onclick="acceptCookies()" class="bg-cyanAccent hover:bg-white text-background font-black px-6 py-2 rounded-lg text-xs uppercase tracking-widest transition-colors whitespace-nowrap shadow-[0_0_15px_rgba(6,182,212,0.3)]">
            Initialize Trackers
        </button>
    </div>

    <script>
        // Show banner if no consent is logged
        if (!localStorage.getItem('terminal_cookie_consent')) {
            document.getElementById('cookie-banner').style.display = 'flex';
        }
    </script>

    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-brand/5 blur-[150px] rounded-full pointer-events-none -z-10"></div>

    <nav id="global-nav" class="bg-background/80 backdrop-blur-md sticky top-0 z-50 border-b border-white/10"></nav>

    <main class="flex-grow flex items-center justify-center p-4 relative z-10 py-12">
        <div class="w-full max-w-md">
            <div class="text-center mb-10">
                <a href="index.html" class="inline-block">
                    <img src="assets/images/teminal-logo.jpg" alt="Terminal Software" class="h-16 w-auto rounded-xl shadow-[0_0_20px_rgba(245,158,11,0.2)] mx-auto mb-6">
                </a>
                <h1 class="font-heading text-3xl font-black text-white uppercase tracking-tight">System <span class="text-brand">Access</span></h1>
                <p class="text-slate-500 font-medium mt-2 uppercase tracking-widest text-xs">Developer Authentication</p>
            </div>

            <div class="bg-white/5 backdrop-blur-xl p-8 rounded-3xl border border-white/10 shadow-2xl relative overflow-hidden group hover:border-brand/30 transition duration-500">
                
                <form id="auth-form" class="space-y-6 relative z-10">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">Secure Email</label>
                        <input type="email" id="email" required class="w-full bg-background border border-white/10 rounded-xl px-5 py-3 text-white focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition font-mono" placeholder="dev@institution.com">
                    </div>
                    <div id="password-field">
                        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">Passphrase</label>
                        <input type="password" id="password" required class="w-full bg-background border border-white/10 rounded-xl px-5 py-3 text-white focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition font-mono" placeholder="••••••••••••">
                    </div>
                    
                    <div id="error-message" class="hidden text-red-400 text-xs font-bold uppercase tracking-wide text-center bg-red-500/10 py-2 rounded border border-red-500/20"></div>

                    <button type="submit" id="submit-btn" class="w-full bg-brand text-background font-black text-lg py-4 rounded-xl hover:bg-yellow-400 hover:shadow-[0_0_30px_rgba(245,158,11,0.4)] transition-all duration-300 uppercase tracking-widest mt-4">
                        Authenticate
                    </button>
                </form>

                <div class="mt-6 flex flex-col gap-4 relative z-10" id="oauth-container">
                    <div class="flex items-center gap-3">
                        <div class="h-px bg-white/10 flex-grow"></div>
                        <span class="text-[10px] text-slate-500 font-mono uppercase tracking-widest">Or</span>
                        <div class="h-px bg-white/10 flex-grow"></div>
                    </div>
                    
                    <button type="button" onclick="signInWithGoogle()" class="w-full bg-white/5 hover:bg-white/10 text-white border border-white/10 font-bold py-3.5 rounded-xl transition-all duration-300 flex items-center justify-center gap-3 uppercase tracking-widest text-xs shadow-[0_0_15px_rgba(255,255,255,0.05)]">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Continue with Google
                    </button>
                </div>
                
                <div class="mt-6 text-center border-t border-white/5 pt-6 relative z-10 flex flex-col gap-4">
                    <button type="button" id="toggle-mode" onclick="toggleMainMode()" class="text-xs text-slate-400 hover:text-white font-bold uppercase tracking-widest transition outline-none cursor-pointer relative z-50">
                        Need an account? <span class="text-brand underline decoration-brand/30 underline-offset-4">Register here</span>
                    </button>
                    
                    <button type="button" id="forgot-password-btn" onclick="setAuthMode('reset')" class="text-xs text-slate-500 hover:text-slate-300 font-bold uppercase tracking-widest transition outline-none cursor-pointer relative z-50">
                        Forgot Passphrase? <span class="underline decoration-slate-500/50 underline-offset-4">Reset here</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer id="global-footer" class="bg-background py-12 border-t border-slate-800 mt-auto relative z-20"></footer>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/components.js"></script>

    <script>
        // UI STATE LOGIC
        let authMode = 'login'; // Modes: 'login', 'register', 'reset'

        function setAuthMode(mode) {
            authMode = mode;
            const submitBtn = document.getElementById('submit-btn');
            const toggleModeBtn = document.getElementById('toggle-mode');
            const forgotPasswordBtn = document.getElementById('forgot-password-btn');
            const passwordField = document.getElementById('password-field');
            const passwordInput = document.getElementById('password');
            const oauthContainer = document.getElementById('oauth-container');
            const errorDiv = document.getElementById('error-message');

            errorDiv.classList.add('hidden');

            if (mode === 'login') {
                submitBtn.innerText = 'Authenticate';
                toggleModeBtn.innerHTML = 'Need an account? <span class="text-brand underline decoration-brand/30 underline-offset-4">Register here</span>';
                forgotPasswordBtn.classList.remove('hidden');
                passwordField.classList.remove('hidden');
                oauthContainer.classList.remove('hidden');
                passwordInput.required = true;
            } else if (mode === 'register') {
                submitBtn.innerText = 'Initialize Account';
                toggleModeBtn.innerHTML = 'Have an account? <span class="text-brand underline decoration-brand/30 underline-offset-4">Login here</span>';
                forgotPasswordBtn.classList.add('hidden');
                passwordField.classList.remove('hidden');
                oauthContainer.classList.remove('hidden');
                passwordInput.required = true;
            } else if (mode === 'reset') {
                submitBtn.innerText = 'Send Reset Link';
                toggleModeBtn.innerHTML = 'Back to <span class="text-brand underline decoration-brand/30 underline-offset-4">Login</span>';
                forgotPasswordBtn.classList.add('hidden');
                passwordField.classList.add('hidden');
                oauthContainer.classList.add('hidden');
                passwordInput.required = false; // Not needed for reset
            }
        }

        function toggleMainMode() {
            if (authMode === 'login' || authMode === 'reset') {
                setAuthMode('register');
            } else {
                setAuthMode('login');
            }
        }

        // GOOGLE OAUTH LOGIC
        async function signInWithGoogle() {
            try {
                if (typeof window.db === 'undefined') {
                    throw new Error("Database connection error. Supabase client missing.");
                }
                const { data, error } = await window.db.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/dashboard.html'
                    }
                });
                
                if (error) throw error;

            } catch (err) {
                console.error("Google Auth Error:", err.message);
                const errorDiv = document.getElementById('error-message');
                errorDiv.innerText = err.message || "Failed to initialize Google Authentication.";
                errorDiv.classList.remove('hidden');
            }
        }

        // DATABASE & FORM LOGIC
        document.addEventListener('DOMContentLoaded', async () => {
            
            // Route logged-in users directly to dashboard
            try {
                if (typeof window.db !== 'undefined') {
                    const { data: { session } } = await window.db.auth.getSession();
                    if (session) {
                        window.location.href = 'dashboard.html';
                    }
                }
            } catch(e) { console.error("Session check error:", e); }

            const form = document.getElementById('auth-form');
            const submitBtn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-message');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                // Track auth attempts
                if (typeof gtag !== 'undefined') {
                    gtag('event', 'login', {
                      'event_category': 'authentication',
                      'event_label': authMode
                    });
                }
                
                submitBtn.disabled = true;
                submitBtn.innerText = 'Processing...';
                errorDiv.classList.add('hidden');

                if (typeof window.db === 'undefined') {
                    errorDiv.innerText = "Database connection error.";
                    errorDiv.classList.remove('hidden');
                    submitBtn.disabled = false;
                    return;
                }

                let error;
                if (authMode === 'login') {
                    const { error: signInError } = await window.db.auth.signInWithPassword({ email, password });
                    error = signInError;
                } else if (authMode === 'register') {
                    const { error: signUpError } = await window.db.auth.signUp({ email, password });
                    error = signUpError;
                    if (!error) {
                        alert('Registration successful. Please log in.');
                        setAuthMode('login');
                        submitBtn.disabled = false;
                        return;
                    }
                } else if (authMode === 'reset') {
                    const { error: resetError } = await window.db.auth.resetPasswordForEmail(email, {
                        redirectTo: window.location.origin + '/login.html', 
                    });
                    error = resetError;
                    if (!error) {
                        alert('Password reset link sent! Check your inbox.');
                        setAuthMode('login');
                        submitBtn.disabled = false;
                        return;
                    }
                }

                if (error) {
                    errorDiv.innerText = error.message;
                    errorDiv.classList.remove('hidden');
                    submitBtn.disabled = false;
                    
                    // Reset text
                    if (authMode === 'login') submitBtn.innerText = 'Authenticate';
                    else if (authMode === 'register') submitBtn.innerText = 'Initialize Account';
                    else submitBtn.innerText = 'Send Reset Link';
                } else if (authMode === 'login') {
                    window.location.href = 'dashboard.html';
                }
            });
        });
    </script>
</body>
</html>
