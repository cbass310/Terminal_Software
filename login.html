    <script>
        // PROJECT-SPECIFIC SUPABASE CONFIGURATION
        const supabaseUrl = 'https://pkyvpckvpnfksykhuqew.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBreXZwY2t2cG5ma3N5a2h1cWV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1NzY2MzUsImV4cCI6MjA5MjE1MjYzNX0.k1dOad6WRSmTnuc1__cWDEtZCHN89vDQvOyyH5OWUHo';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        let isLogin = true;
        const form = document.getElementById('auth-form');
        const submitBtn = document.getElementById('submit-btn');
        const toggleModeBtn = document.getElementById('toggle-mode');
        const errorDiv = document.getElementById('error-message');

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            // IF ALREADY LOGGED IN -> SEND TO DASHBOARD
            if (session) window.location.href = 'dashboard.html';
        });

        toggleModeBtn.addEventListener('click', () => {
            isLogin = !isLogin;
            submitBtn.innerText = isLogin ? 'Authenticate' : 'Initialize Account';
            toggleModeBtn.innerHTML = isLogin 
                ? 'Need an account? <span class="text-brand underline decoration-brand/30 underline-offset-4">Register here</span>' 
                : 'Have an account? <span class="text-brand underline decoration-brand/30 underline-offset-4">Login here</span>';
            errorDiv.classList.add('hidden');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'Processing...';
            errorDiv.classList.add('hidden');

            let error;
            if (isLogin) {
                const { error: signInError } = await supabase.auth.signInWithPassword({ email, password });
                error = signInError;
            } else {
                const { error: signUpError } = await supabase.auth.signUp({ email, password });
                error = signUpError;
                if (!error) {
                    alert('Registration successful. Please log in.');
                    isLogin = true;
                    submitBtn.innerText = 'Authenticate';
                    submitBtn.disabled = false;
                    return;
                }
            }

            if (error) {
                errorDiv.innerText = error.message;
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerText = isLogin ? 'Authenticate' : 'Initialize Account';
            } else {
                // SUCCESSFUL LOGIN -> SEND TO DASHBOARD
                window.location.href = 'dashboard.html';
            }
        });

        // Mobile Menu Logic
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('mobile-menu-btn');
            const menu = document.getElementById('mobile-menu');

            if (btn && menu) {
                btn.addEventListener('click', () => {
                    const isExpanded = btn.getAttribute('aria-expanded') === 'true';
                    btn.setAttribute('aria-expanded', !isExpanded);

                    if (!isExpanded) {
                        menu.classList.remove('hidden');
                        setTimeout(() => {
                            menu.classList.remove('opacity-0', '-translate-y-4');
                            menu.classList.add('opacity-100', 'translate-y-0');
                        }, 10);
                    } else {
                        menu.classList.remove('opacity-100', 'translate-y-0');
                        menu.classList.add('opacity-0', '-translate-y-4');
                        setTimeout(() => {
                            menu.classList.add('hidden');
                        }, 300);
                    }
                });
            }
        });
    </script>
