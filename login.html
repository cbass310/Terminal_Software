<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

    <script src="https://cdn.tailwindcss.com"></script>

        tailwind.config = {

                    colors: {
                        brand: { DEFAULT: '#f59e0b', hover: '#d97706' },
                        studio: '#0f172a',

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-background text-slate-300 font-sans antialiased selection:bg-brand selection:text-background flex flex-col min-h-screen relative overflow-x-hidden">

    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-brand/5 blur-[150px] rounded-full pointer-events-none -z-10"></div>

    <nav class="bg-background/80 backdrop-blur-md sticky top-0 z-50 border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                
                <a href="index.html" class="flex items-center gap-3 group">
                    <img src="assets/images/teminal-logo.jpg" alt="Terminal Software Logo" class="h-11 w-auto rounded-md shadow-md transform group-hover:scale-105 transition-all duration-300">
                    <span class="font-heading text-2xl font-black uppercase tracking-tighter text-white hidden sm:block drop-shadow-sm group-hover:opacity-90 transition-opacity duration-300">
                        Terminal<span class="text-brand">Software</span>
                    </span>
                </a>

                <div class="hidden md:flex gap-8 items-center">
                    <a href="index.html" class="text-sm font-semibold text-white hover:text-brand transition tracking-wide uppercase">Home</a>
                    <a href="api.html" class="text-sm font-semibold text-white hover:text-cyanAccent transition tracking-wide uppercase">API</a>
                    <a href="squared-circle-tycoon.html" class="text-sm font-semibold text-white hover:text-brand transition tracking-wide uppercase">Games</a>
                    <a href="store.html" class="text-sm font-semibold text-white hover:text-brand transition tracking-wide uppercase">Store</a>
                    
                    <a href="login.html" id="nav-connect-btn" class="text-xs font-bold bg-brand/10 hover:bg-brand hover:text-background text-brand border border-brand/30 py-2 px-4 rounded-lg transition-all uppercase tracking-widest ml-4 shadow-[0_0_10px_rgba(245,158,11,0.2)]">
                        Connect
                    </a>
                    <button id="nav-disconnect-btn" class="hidden text-xs font-bold bg-white/10 hover:bg-red-500/20 hover:text-red-400 text-slate-400 border border-white/10 hover:border-red-500/50 py-2 px-4 rounded-lg transition-all uppercase tracking-widest ml-4">
                        Disconnect
                    </button>
                </div>

                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" aria-expanded="false" aria-controls="mobile-menu" class="text-slate-400 hover:text-white focus:outline-none p-2 transition">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>

            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden absolute w-full bg-studio/95 backdrop-blur-xl border-b border-white/10 transition-all duration-300 ease-in-out opacity-0 transform -translate-y-4 shadow-2xl">
            <div class="px-4 pt-4 pb-6 space-y-3">
                <a href="index.html" class="block px-4 py-3 rounded-xl text-base font-black text-white hover:text-brand hover:bg-white/5 uppercase tracking-wide transition">Home</a>
                <a href="api.html" class="block px-4 py-3 rounded-xl text-base font-black text-white hover:text-cyanAccent hover:bg-white/5 uppercase tracking-wide transition">API</a>
                <a href="squared-circle-tycoon.html" class="block px-4 py-3 rounded-xl text-base font-black text-white hover:text-brand hover:bg-white/5 uppercase tracking-wide transition">Games</a>
                <a href="store.html" class="block px-4 py-3 rounded-xl text-base font-black text-white hover:text-brand hover:bg-white/5 uppercase tracking-wide transition">Store</a>
                
                <a href="login.html" id="mobile-connect-btn" class="block px-4 py-3 rounded-xl text-base font-black text-background bg-brand hover:bg-yellow-400 uppercase tracking-wide transition shadow-lg text-center mt-4">Connect</a>
                <button id="mobile-disconnect-btn" class="hidden w-full px-4 py-3 rounded-xl text-base font-black text-red-400 bg-white/5 border border-white/10 hover:bg-red-500/20 hover:border-red-500/50 uppercase tracking-wide transition text-center mt-4">Disconnect</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4 relative z-10 py-12">
        <div class="w-full max-w-md">
            <div class="text-center mb-10">
                <a href="index.html" class="inline-block">
                    <img src="assets/images/teminal-logo.jpg" alt="Terminal Software" class="h-16 w-auto rounded-xl shadow-[0_0_20px_rgba(245,158,11,0.2)] mx-auto mb-6">
                </a>
                <h1 class="font-heading text-3xl font-black text-white uppercase tracking-tight">System <span class="text-brand">Access</span></h1>
                <p class="text-slate-500 font-medium mt-2 uppercase tracking-widest text-xs">Developer Authentication</p>
            </div>

            <div class="bg-white/5 backdrop-blur-xl p-8 rounded-3xl border border-white/10 shadow-2xl relative overflow-hidden group hover:border-brand/30 transition duration-500">
                
                <form id="auth-form" class="space-y-6 relative z-10">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">Secure Email</label>
                        <input type="email" id="email" required class="w-full bg-background border border-white/10 rounded-xl px-5 py-3 text-white focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition font-mono" placeholder="dev@institution.com">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">Passphrase</label>
                        <input type="password" id="password" required class="w-full bg-background border border-white/10 rounded-xl px-5 py-3 text-white focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition font-mono" placeholder="••••••••••••">
                    </div>
                    
                    <div id="error-message" class="hidden text-red-400 text-xs font-bold uppercase tracking-wide text-center bg-red-500/10 py-2 rounded border border-red-500/20"></div>

                    <button type="submit" id="submit-btn" class="w-full bg-brand text-background font-black text-lg py-4 rounded-xl hover:bg-yellow-400 hover:shadow-[0_0_30px_rgba(245,158,11,0.4)] transition-all duration-300 uppercase tracking-widest mt-4">
                        Authenticate
                    </button>
                </form>
                
                <div class="mt-6 text-center border-t border-white/5 pt-6 relative z-10">
                    <button id="toggle-mode" class="text-xs text-slate-400 hover:text-white font-bold uppercase tracking-widest transition outline-none">
                        Need an account? <span class="text-brand underline decoration-brand/30 underline-offset-4">Register here</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-background py-12 border-t border-slate-800 mt-auto relative z-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center text-sm text-slate-500 font-medium gap-6">
            <div class="flex items-center gap-3">
                <img src="assets/images/teminal-logo.jpg" alt="Terminal Software Icon" class="h-8 w-auto grayscale opacity-50 rounded">
                &copy; 2026 Terminal Software. All rights reserved.
            </div>
            
            <div class="flex flex-wrap justify-center gap-8">
                <a href="tos.html" class="hover:text-white transition uppercase tracking-wide text-xs">Terms of Service</a>
                <a href="privacy.html" class="hover:text-white transition uppercase tracking-wide text-xs">Privacy</a>
                <a href="about.html" class="hover:text-white transition uppercase tracking-wide text-xs">Contact</a>
            </div>
        </div>
    </footer>

    <script>
        // PROJECT-SPECIFIC SUPABASE CONFIGURATION
        const supabaseUrl = 'https://pkyvpckvpnfksykhuqew.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBreXZwY2t2cG5ma3N5a2h1cWV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1NzY2MzUsImV4cCI6MjA5MjE1MjYzNX0.k1dOad6WRSmTnuc1__cWDEtZCHN89vDQvOyyH5OWUHo';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        let isLogin = true;
        const form = document.getElementById('auth-form');
        const submitBtn = document.getElementById('submit-btn');
        const toggleModeBtn = document.getElementById('toggle-mode');
        const errorDiv = document.getElementById('error-message');

        // UI BUTTONS
        const navConnectBtn = document.getElementById('nav-connect-btn');
        const navDisconnectBtn = document.getElementById('nav-disconnect-btn');
        const mobileConnectBtn = document.getElementById('mobile-connect-btn');
        const mobileDisconnectBtn = document.getElementById('mobile-disconnect-btn');

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            
            // IF ALREADY LOGGED IN -> SHOW DISCONNECT, HIDE CONNECT, & SEND TO DASHBOARD
            if (session) {
                if(navConnectBtn) navConnectBtn.classList.add('hidden');
                if(mobileConnectBtn) mobileConnectBtn.classList.add('hidden');
                if(navDisconnectBtn) navDisconnectBtn.classList.remove('hidden');
                if(mobileDisconnectBtn) mobileDisconnectBtn.classList.remove('hidden');
                
                window.location.href = 'dashboard.html';
            }
        });

        // HANDLE DISCONNECT CLICKS
        const handleLogout = async () => {
            await supabase.auth.signOut();
            window.location.reload();
        };

        if(navDisconnectBtn) navDisconnectBtn.addEventListener('click', handleLogout);
        if(mobileDisconnectBtn) mobileDisconnectBtn.addEventListener('click', handleLogout);

        // TOGGLE LOGIN/REGISTER UI (Fixed the event parameter bug here)
        toggleModeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            
            isLogin = !isLogin;
            submitBtn.innerText = isLogin ? 'Authenticate' : 'Initialize Account';
            toggleModeBtn.innerHTML = isLogin 
                ? 'Need an account? <span class="text-brand underline decoration-brand/30 underline-offset-4">Register here</span>' 
                : 'Have an account? <span class="text-brand underline decoration-brand/30 underline-offset-4">Login here</span>';
            errorDiv.classList.add('hidden');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'Processing...';
            errorDiv.classList.add('hidden');

            let error;
            if (isLogin) {
                const { error: signInError } = await supabase.auth.signInWithPassword({ email, password });
                error = signInError;
            } else {
                const { error: signUpError } = await supabase.auth.signUp({ email, password });
                error = signUpError;
                if (!error) {
                    alert('Registration successful. Please log in.');
                    isLogin = true;
                    submitBtn.innerText = 'Authenticate';
                    submitBtn.disabled = false;
                    
                    // Reset the toggle text
                    toggleModeBtn.innerHTML = 'Need an account? <span class="text-brand underline decoration-brand/30 underline-offset-4">Register here</span>';
                    return;
                }
            }

            if (error) {
                errorDiv.innerText = error.message;
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerText = isLogin ? 'Authenticate' : 'Initialize Account';
            } else {
                // SUCCESSFUL LOGIN -> SEND TO DASHBOARD
                window.location.href = 'dashboard.html';
            }
        });

        // Mobile Menu Logic
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('mobile-menu-btn');
            const menu = document.getElementById('mobile-menu');

            if (btn && menu) {
                btn.addEventListener('click', () => {
                    const isExpanded = btn.getAttribute('aria-expanded') === 'true';
                    btn.setAttribute('aria-expanded', !isExpanded);

                    if (!isExpanded) {
                        menu.classList.remove('hidden');
                        setTimeout(() => {
                            menu.classList.remove('opacity-0', '-translate-y-4');
                            menu.classList.add('opacity-100', 'translate-y-0');
                        }, 10);
                    } else {
                        menu.classList.remove('opacity-100', 'translate-y-0');
                        menu.classList.add('opacity-0', '-translate-y-4');
                        setTimeout(() => {
                            menu.classList.add('hidden');
                        }, 300);
                    }
                });
            }
        });
    </script>
</body>
</html>
