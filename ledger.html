<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Terminal Software Verified Ledger. Track real-world execution, Closing Line Value (CLV), and System ROI.">
    <title>Verified Matrix Ledger | Terminal Software</title>
    
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,900&family=Inter:wght@400;500;600;700&family=Oswald:wght@700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#f59e0b', hover: '#d97706' },
                        studio: '#0f172a',
                        background: '#020617',
                        cyanAccent: '#06b6d4',
                        redAccent: '#ef4444',
                        void: '#0A0A0A',
                        neon: '#39FF14',
                    },
                    fontFamily: {
                        heading: ['Montserrat', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                        impact: ['Oswald', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #020617; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-300 font-sans min-h-screen flex flex-col selection:bg-neon selection:text-void overflow-x-hidden relative">

    <div id="ambient-glow" class="fixed top-0 left-1/4 w-[800px] h-[600px] bg-[radial-gradient(circle_at_center,rgba(57,255,20,0.05)_0%,transparent_60%)] rounded-full pointer-events-none -z-10"></div>

    <nav id="global-nav" class="bg-background/80 backdrop-blur-md sticky top-0 z-50 border-b border-white/10"></nav>

    <header class="pt-12 pb-8 border-b border-white/5 relative z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-neon/10 border border-neon/30 text-neon text-[10px] font-black uppercase tracking-widest mb-6 shadow-[0_0_15px_rgba(57,255,20,0.2)]">
                <span class="w-1.5 h-1.5 rounded-full bg-neon animate-pulse"></span>
                Public Verification Portal
            </div>
            <h1 class="font-heading text-4xl md:text-5xl font-black text-white uppercase tracking-tight mb-4">
                Verified <span class="text-white">Matrix</span>
            </h1>
            <p class="text-slate-400 font-medium max-w-2xl mx-auto text-sm uppercase tracking-widest font-mono">
                Transparent performance tracking. Every edge accounted for.
            </p>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10 relative z-10">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <div class="bg-white/5 border border-white/10 rounded-2xl p-6 relative overflow-hidden group hover:border-white/30 transition-colors">
                <div class="absolute -right-6 -top-6 w-24 h-24 bg-white/5 rounded-full blur-xl group-hover:bg-white/10 transition-colors"></div>
                <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 relative z-10">Total Settled Plays</h3>
                <p id="metric-settled" class="font-impact text-4xl text-white relative z-10">0</p>
            </div>
            
            <div class="bg-white/5 border border-white/10 rounded-2xl p-6 relative overflow-hidden group hover:border-neon/30 transition-colors shadow-lg">
                <div class="absolute -right-6 -top-6 w-24 h-24 bg-neon/10 rounded-full blur-xl group-hover:bg-neon/20 transition-colors"></div>
                <h3 class="text-[10px] font-bold text-neon uppercase tracking-widest mb-2 relative z-10">System Win Rate</h3>
                <p id="metric-winrate" class="font-impact text-4xl text-neon relative z-10">0.00%</p>
            </div>
            
            <div class="bg-white/5 border border-white/10 rounded-2xl p-6 relative overflow-hidden group hover:border-neon/30 transition-colors shadow-lg">
                <div class="absolute -right-6 -top-6 w-24 h-24 bg-neon/10 rounded-full blur-xl group-hover:bg-neon/20 transition-colors"></div>
                <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 relative z-10">System ROI</h3>
                <p id="metric-roi" class="font-impact text-4xl text-white relative z-10">+0.00%</p>
            </div>
        </div>

        <div class="bg-studio/50 border border-white/10 rounded-3xl overflow-hidden shadow-2xl backdrop-blur-sm">
            <div class="p-6 border-b border-white/10 bg-black/40 flex justify-between items-center">
                <h2 class="font-heading text-lg font-black text-white uppercase tracking-widest">Player Prop Scouting Log</h2>
                <button onclick="fetchLedgerData()" class="text-neon hover:text-white transition-colors focus:outline-none" title="Refresh Ledger">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
            
            <div class="overflow-x-auto hide-scrollbar">
                <table class="w-full text-left border-collapse min-w-[800px]">
                    <thead>
                        <tr class="bg-black/60 border-b border-white/10 text-[9px] font-bold text-slate-500 uppercase tracking-widest">
                            <th class="py-4 px-6 font-medium">Date / Time</th>
                            <th class="py-4 px-6 font-medium">Matchup</th>
                            <th class="py-4 px-6 font-medium">Target Prop</th>
                            <th class="py-4 px-6 font-medium">Platform</th>
                            <th class="py-4 px-6 font-medium text-right">Edge %</th>
                            <th class="py-4 px-6 font-medium text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="ledger-table-body" class="divide-y divide-white/5 font-mono text-xs">
                        <tr>
                            <td colspan="6" class="py-20 text-center">
                                <div class="inline-block w-8 h-8 border-4 border-white/10 border-t-neon rounded-full animate-spin mb-4"></div>
                                <p class="text-neon font-bold tracking-widest uppercase text-[10px] animate-pulse">Querying Verification Matrix...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <footer id="global-footer" class="bg-background py-12 border-t border-slate-800 mt-auto relative z-20"></footer>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/components.js"></script>

    <script>
        // Helper: Convert American Odds to Decimal for Profit Math (Default DFS odds to -110 if missing)
        function convertToDecimal(americanStr) {
            let odds = parseFloat(String(americanStr).replace('+', ''));
            if (isNaN(odds)) odds = -110; 
            if (odds > 0) return (odds / 100) + 1;
            if (odds < 0) return (100 / Math.abs(odds)) + 1;
            return 1; 
        }

        async function fetchLedgerData() {
            const tbody = document.getElementById('ledger-table-body');
            
            try {
                // 1. BULLETPROOF INITIALIZATION CHECK
                // If auth.js hasn't mounted the client yet, spin up a local instance immediately.
                if (typeof window.db === 'undefined' || !window.db) {
                    if (typeof window.supabase !== 'undefined') {
                        const supabaseUrl = 'https://pkyvpckvpnfksykhuqew.supabase.co';
                        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBreXZwY2t2cG5ma3N5a2h1cWV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1NzY2MzUsImV4cCI6MjA5MjE1MjYzNX0.k1dOad6WRSmTnuc1__cWDEtZCHN89vDQvOyyH5OWUHo';
                        window.db = window.supabase.createClient(supabaseUrl, supabaseKey);
                    } else {
                        throw new Error("Supabase CDN blocked or failed to load.");
                    }
                }

                const db = window.db;

                // REROUTED TO PYTHON GRADING ENGINE TABLE
                const { data, error } = await db.from('dfs_live_data')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(150);

                if (error) throw error;

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="py-12 text-center text-slate-500 font-bold uppercase tracking-widest text-[10px]">Matrix Empty. Awaiting Python Grader.</td></tr>`;
                    document.getElementById('metric-settled').innerText = "0";
                    document.getElementById('metric-winrate').innerText = "0.00%";
                    document.getElementById('metric-roi').innerText = "+0.00%";
                    return;
                }

                let totalSettled = 0;
                let wonPlays = 0;
                let totalStakeSettled = 0;
                let totalProfit = 0;

                let rowsHtml = '';

                data.forEach(edge => {
                    const status = String(edge.status || 'pending').toLowerCase();
                    const stake = 100; // Standard 1u execution size for system matrix
                    
                    if (status === 'won' || status === 'lost') {
                        totalSettled++;
                        totalStakeSettled += stake;
                        
                        if (status === 'won') {
                            wonPlays++;
                            const dec = convertToDecimal(edge.odds);
                            const profit = (stake * dec) - stake;
                            totalProfit += profit;
                        } else if (status === 'lost') {
                            totalProfit -= stake;
                        }
                    }

                    const dateObj = edge.created_at ? new Date(edge.created_at) : new Date();
                    const dateStr = dateObj.toLocaleDateString('en-US', { month: 'short', day: '2-digit' });
                    const timeStr = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

                    let statusHtml = `<span class="bg-slate-500/20 text-slate-400 border border-slate-500/30 px-2 py-1 rounded text-[9px] font-black uppercase tracking-widest">PENDING</span>`;
                    let edgeColorClass = "text-slate-300";

                    if (status === 'won') {
                        statusHtml = `<span class="bg-neon/20 text-neon border border-neon/30 px-2 py-1 rounded text-[9px] font-black uppercase tracking-widest">WON</span>`;
                        edgeColorClass = "text-neon font-bold";
                    } else if (status === 'lost') {
                        statusHtml = `<span class="bg-redAccent/20 text-redAccent border border-redAccent/30 px-2 py-1 rounded text-[9px] font-black uppercase tracking-widest">LOST</span>`;
                        edgeColorClass = "text-redAccent line-through opacity-70";
                    }

                    const edgePct = parseFloat(edge.ev_pct || edge.edge_percent || edge.ev || edge.edge || 0).toFixed(2);
                    const propStr = escapeHtml(edge.target || edge.prop || edge.play || edge.selection || edge.description || "UNKNOWN PROP");

                    rowsHtml += `
                        <tr class="hover:bg-white/5 transition-colors group">
                            <td class="py-4 px-6 whitespace-nowrap">
                                <span class="text-white font-bold block">${dateStr}</span>
                                <span class="text-slate-500 text-[10px]">${timeStr}</span>
                            </td>
                            <td class="py-4 px-6">
                                <span class="text-white font-bold block truncate max-w-[200px] sm:max-w-xs">${escapeHtml(edge.match_name || edge.team || 'MATCH')}</span>
                                <span class="text-slate-500 text-[10px] uppercase tracking-widest mt-1">${escapeHtml(edge.league || edge.sport || '')}</span>
                            </td>
                            <td class="py-4 px-6">
                                <span class="text-white font-bold block truncate max-w-[250px]">${propStr}</span>
                            </td>
                            <td class="py-4 px-6">
                                <span class="bg-studio border border-white/10 px-2 py-1 rounded text-[9px] font-black text-slate-300 uppercase tracking-widest">${escapeHtml(edge.book || edge.platform || 'PLATFORM')}</span>
                            </td>
                            <td class="py-4 px-6 text-right ${edgeColorClass}">+${edgePct}%</td>
                            <td class="py-4 px-6 text-center">${statusHtml}</td>
                        </tr>
                    `;
                });

                tbody.innerHTML = rowsHtml;

                // --- ZERO-CRASH MATH LOGIC ---
                document.getElementById('metric-settled').innerText = totalSettled;

                if (totalSettled > 0) {
                    const winRate = ((wonPlays / totalSettled) * 100).toFixed(2);
                    document.getElementById('metric-winrate').innerText = winRate + "%";
                } else {
                    document.getElementById('metric-winrate').innerText = "0.00%";
                }

                if (totalStakeSettled > 0) {
                    const roi = ((totalProfit / totalStakeSettled) * 100).toFixed(2);
                    const roiEl = document.getElementById('metric-roi');
                    roiEl.innerText = (totalProfit >= 0 ? "+" : "") + roi + "%";
                    
                    if (totalProfit < 0) {
                        roiEl.classList.remove('text-white');
                        roiEl.classList.add('text-redAccent');
                    } else {
                        roiEl.classList.add('text-neon');
                    }
                } else {
                    document.getElementById('metric-roi').innerText = "+0.00%";
                }

            } catch (err) {
                console.error("Matrix Sync Error:", err);
                
                // 2. BULLETPROOF CATCH BLOCK (Nukes the spinner instantly)
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="py-12 text-center bg-red-500/5">
                            <span class="text-redAccent font-black uppercase tracking-widest text-[10px]">SYSTEM OFFLINE: SUPABASE CONNECTION FAILED</span><br>
                            <span class="text-slate-500 font-mono text-[9px] mt-2 block">${err.message}</span>
                        </td>
                    </tr>
                `;
                
                document.getElementById('metric-settled').innerText = "0";
                document.getElementById('metric-winrate').innerText = "0.00%";
                document.getElementById('metric-roi').innerText = "+0.00%";
            }
        }

        // Helper to escape HTML characters
        function escapeHtml(unsafe) {
            if (!unsafe) return "";
            return String(unsafe)
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "\\'"); 
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof renderGlobalComponents === 'function') renderGlobalComponents();
            fetchLedgerData();
        });
    </script>
</body>
</html>
