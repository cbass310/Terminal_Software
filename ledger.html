                    <div class="bg-slate-800 border border-slate-700 text-slate-400 px-4 py-1.5 rounded-lg flex items-center justify-center gap-2 w-28 shrink-0">
                        <span class="w-1.5 h-1.5 rounded-full bg-slate-500 animate-pulse"></span>
                        <span class="font-black font-mono text-[10px] uppercase tracking-widest">PENDING</span>
                    </div>`;
            }
        }

        // --- 3. UI RENDERING & TOGGLES ---
        function switchLedgerTab(target) {
            currentTab = target;
            
            const btnEv = document.getElementById('toggle-ev');
            const btnDfs = document.getElementById('toggle-dfs');
            const bgAmbient = document.getElementById('ambient-bg');
            const winRateCard = document.getElementById('win-rate-card');
            const statusPulse = document.getElementById('status-pulse');
            const statusText = document.getElementById('status-text');
            const selectIcons = document.querySelectorAll('select + svg');
            const ledgerTitle = document.getElementById('ledger-feed-title');

            if (target === 'ev') {
                btnEv.className = "flex-1 md:flex-none px-6 py-3 rounded-xl font-heading text-xs font-black uppercase tracking-widest transition-all duration-300 bg-neon/10 text-neon border border-neon/30 shadow-[0_0_15px_rgba(57,255,20,0.1)]";
                btnDfs.className = "flex-1 md:flex-none px-6 py-3 rounded-xl font-heading text-xs font-black uppercase tracking-widest transition-all duration-300 text-slate-500 hover:text-white border border-transparent";
                
                bgAmbient.className = "fixed top-0 left-1/4 w-[800px] h-[600px] bg-[radial-gradient(circle_at_center,rgba(57,255,20,0.05)_0%,transparent_60%)] rounded-full pointer-events-none -z-10 transition-colors duration-700";
                winRateCard.className = "bg-white/5 backdrop-blur-md border border-neon/30 rounded-2xl p-6 sm:p-8 flex flex-col items-center md:items-start shadow-[0_0_30px_rgba(57,255,20,0.05)] relative overflow-hidden transition-colors duration-500 text-neon";
                
                statusPulse.className = "w-2 h-2 rounded-full bg-neon shadow-[0_0_8px_rgba(57,255,20,0.8)]";
                statusText.className = "font-mono font-bold text-neon text-[10px] tracking-widest uppercase";
                selectIcons.forEach(i => i.classList.replace('text-cyanAccent', 'text-neon'));
                
                ledgerTitle.innerText = "Game Execution Log";
                
                calculateScoreboard(rawEvData);
                renderLedger();
                
            } else {
                btnDfs.className = "flex-1 md:flex-none px-6 py-3 rounded-xl font-heading text-xs font-black uppercase tracking-widest transition-all duration-300 bg-cyanAccent/10 text-cyanAccent border border-cyanAccent/30 shadow-[0_0_15px_rgba(6,182,212,0.1)]";
                btnEv.className = "flex-1 md:flex-none px-6 py-3 rounded-xl font-heading text-xs font-black uppercase tracking-widest transition-all duration-300 text-slate-500 hover:text-white border border-transparent";
                
                bgAmbient.className = "fixed top-0 left-1/4 w-[800px] h-[600px] bg-[radial-gradient(circle_at_center,rgba(6,182,212,0.05)_0%,transparent_60%)] rounded-full pointer-events-none -z-10 transition-colors duration-700";
                winRateCard.className = "bg-white/5 backdrop-blur-md border border-cyanAccent/30 rounded-2xl p-6 sm:p-8 flex flex-col items-center md:items-start shadow-[0_0_30px_rgba(6,182,212,0.05)] relative overflow-hidden transition-colors duration-500 text-cyanAccent";
                
                statusPulse.className = "w-2 h-2 rounded-full bg-cyanAccent shadow-[0_0_8px_rgba(6,182,212,0.8)]";
                statusText.className = "font-mono font-bold text-cyanAccent text-[10px] tracking-widest uppercase";
                selectIcons.forEach(i => i.classList.replace('text-neon', 'text-cyanAccent'));

                ledgerTitle.innerText = "Player Prop Scouting Log";

                calculateScoreboard(rawDfsData);
                renderLedger();
            }
        }

        function calculateScoreboard(data) {
            let wins = 0;
            let losses = 0;

            data.forEach(row => {
                const status = String(row.status || 'pending').toLowerCase().trim();
                if (status === 'won' || status === 'win') wins++;
                if (status === 'lost' || status === 'loss') losses++;
            });

            const totalSettled = wins + losses;
            let winRate = "0.00";
            if (totalSettled > 0) winRate = ((wins / totalSettled) * 100).toFixed(2);

            document.getElementById('stat-total-plays').innerText = totalSettled;
            document.getElementById('stat-win-rate').innerText = `${winRate}%`;
        }

        function renderLedger() {
            const container = document.getElementById('ledger-container');
            const dataToRender = currentTab === 'ev' ? rawEvData : rawDfsData;
            const accentColor = currentTab === 'ev' ? 'text-neon' : 'text-cyanAccent';
            
            const activeData = dataToRender.filter(edge => {
                try { return Object.keys(edge).length > 2; } catch(e) { return false; }
            });

            const filteredData = activeData.filter(edge => {
                const status = String(edge.status || 'pending').toLowerCase().trim();
                if (currentStatusFilter === 'won' && status !== 'won' && status !== 'win') return false;
                if (currentStatusFilter === 'lost' && status !== 'lost' && status !== 'loss') return false;
                if (currentStatusFilter === 'pending' && status !== 'pending') return false;
                if (currentStatusFilter === 'settled' && status === 'pending') return false;

                if (currentSportFilter !== 'all') {
                    const searchStr = JSON.stringify(edge).toLowerCase();
                    const detected = detectSport(searchStr);
                    if (currentSportFilter === 'baseball_mlb' && !(searchStr.includes('mlb') || searchStr.includes('baseball') || detected === 'baseball_mlb')) return false;
                    if (currentSportFilter === 'basketball_nba' && !(searchStr.includes('nba') || searchStr.includes('basketball') || detected === 'basketball_nba')) return false;
                    if (currentSportFilter === 'football_nfl' && !(searchStr.includes('nfl') || searchStr.includes('football') || detected === 'football_nfl')) return false;
                    if (currentSportFilter === 'hockey_nhl' && !(searchStr.includes('nhl') || searchStr.includes('hockey') || detected === 'hockey_nhl')) return false;
                }
                return true;
            });

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="border border-dashed border-white/10 bg-black/40 rounded-xl p-12 text-center"><span class="text-slate-500 font-mono font-bold tracking-widest uppercase">No records match the current filter matrix.</span></div>`;
                return;
            }

            let html = '';
            filteredData.forEach(edge => {
                const badgeHtml = createStatusBadge(edge.status);
                const timestamp = edge.time_display || (edge.created_at ? new Date(edge.created_at).toLocaleDateString(undefined, {month: 'short', day: 'numeric', year: 'numeric'}) : "N/A");
                
                if (currentTab === 'ev') {
                    const matchName = edge.match_name || edge.game || edge.event || "UNKNOWN MATCH";
                    const target = edge.target || "UNKNOWN TARGET";
                    let oddsStr = String(edge.odds || "N/A");
                    const odds = (!oddsStr.startsWith('-') && !oddsStr.startsWith('+') && oddsStr !== "N/A") ? '+' + oddsStr : oddsStr;
                    const bookLogo = getSportsbookLogo(edge.sportsbook || edge.book);
                    
                    html += `
                        <div class="bg-white/5 hover:bg-white/10 border border-white/5 rounded-xl p-4 sm:p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 transition-colors">
                            <div class="flex flex-col gap-1 min-w-0 flex-1 w-full">
                                <span class="text-slate-500 font-mono text-[10px] uppercase tracking-widest mb-1">${timestamp}</span>
                                <h3 class="font-impact text-lg sm:text-xl font-black text-white uppercase tracking-wide leading-tight truncate">${matchName}</h3>
                                <div class="flex flex-wrap items-center gap-x-2 gap-y-1 mt-1">
                                    <span class="${accentColor} font-bold text-xs uppercase tracking-wider">${target}</span>
                                    <span class="text-slate-600">|</span>
                                    <span class="text-slate-400 font-mono text-xs uppercase tracking-widest">${edge.market || "MARKET"}</span>
                                </div>
                            </div>
                            <div class="flex items-center justify-between sm:justify-end gap-6 w-full sm:w-auto mt-2 sm:mt-0 pt-3 sm:pt-0 border-t sm:border-none border-white/5">
                                <div class="flex items-center gap-3 shrink-0">
                                    ${bookLogo}
                                    <span class="font-heading font-black text-sm text-white tracking-widest border-l border-white/10 pl-3">${odds}</span>
                                </div>
                                ${badgeHtml}
                            </div>
                        </div>
                    `;
                } else {
                    // DFS Prop Card Layout
                    const playerName = edge.player_name || edge.player || "UNKNOWN PLAYER";
                    const matchName = edge.match_name || edge.team || edge.game || "UNKNOWN MATCH";
                    let rawStat = edge.stat_type || edge.prop_type || edge.market || "PROP";
                    if (typeof rawStat === 'string') rawStat = rawStat.replace(/^player_/i, '').split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
                    const line = edge.target || edge.line || edge.prop_line || "N/A";
                    const side = String(edge.side || edge.over_under || "OVER");
                    const bookLogo = getSportsbookLogo(edge.book || edge.platform || edge.bookmaker || edge.sportsbook);
                    
                    const edgeVal = parseFloat(edge.edge_percent || edge.ev || edge.edge || edge.value || edge.profit || 0).toFixed(2); 
                    
                    // Fallback to team logo to provide premium visual context without breaking headshots
                    const logoUrl = getTeamLogoUrl(matchName);
                    const visualContext = logoUrl ? `<img src="${logoUrl}" class="w-full h-full object-contain p-1">` : `<svg class="w-6 h-6 text-cyanAccent/50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>`;

                    html += `
                        <div class="bg-white/5 hover:bg-white/10 border border-white/5 rounded-xl p-4 sm:p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 transition-colors">
                            <div class="flex items-center gap-4 flex-1 min-w-0 w-full">
                                <div class="w-12 h-12 rounded-full bg-slate-800 border border-white/10 flex items-center justify-center shrink-0 overflow-hidden shadow-inner">
                                    ${visualContext}
                                </div>
                                <div class="flex flex-col gap-1 min-w-0">
                                    <span class="text-slate-500 font-mono text-[10px] uppercase tracking-widest">${timestamp}</span>
                                    <h3 class="font-impact text-lg sm:text-xl font-black text-white uppercase tracking-wide leading-tight truncate">${playerName}</h3>
                                    <span class="text-slate-400 font-mono text-[10px] uppercase tracking-widest truncate">${matchName}</span>
                                </div>
                            </div>
                            
                            <div class="flex items-center justify-between sm:justify-end gap-6 w-full sm:w-auto mt-2 sm:mt-0 pt-3 sm:pt-0 border-t sm:border-none border-white/5">
                                <div class="flex flex-col items-start sm:items-end gap-1">
                                    <span class="text-slate-500 font-mono text-[10px] uppercase tracking-widest">Prop Execution</span>
                                    <div class="flex items-center gap-2">
                                        <span class="${accentColor} font-black uppercase text-sm">${side} ${line}</span>
                                        <span class="text-white font-bold text-xs uppercase">${rawStat}</span>
                                    </div>
                                    <div class="flex items-center gap-2 mt-1">
                                        ${bookLogo}
                                        <span class="text-slate-600">|</span>
                                        <span class="text-slate-400 font-mono text-[10px]">+${edgeVal}% EDGE</span>
                                    </div>
                                </div>
                                ${badgeHtml}
                            </div>
                        </div>
                    `;
                }
            });

            container.innerHTML = html;
        }

        // --- 4. ENGINE DATA FETCH ---
        async function loadAllLedgerData() {
            try {
                if (typeof db === 'undefined') {
                    console.error("Supabase client not initialized.");
                    return;
                }
                
                // Fetch EV Data
                const { data: evData, error: evError } = await db.from(DB_TABLE_EV).select('*').order('created_at', { ascending: false }).limit(1000);
                if (evError) throw evError;
                rawEvData = evData || [];

                // Fetch DFS Data
                const { data: dfsData, error: dfsError } = await db.from(DB_TABLE_DFS).select('*').order('created_at', { ascending: false }).limit(1000);
                if (dfsError) throw dfsError;
                rawDfsData = dfsData || [];
                
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('ledger-container').classList.remove('hidden');

                // Initialize UI with current tab
                switchLedgerTab(currentTab);

            } catch (err) { 
                console.error("Ledger Fetch error:", err); 
                document.getElementById('loading-state').innerHTML = `<p class="font-mono font-bold text-red-500 text-sm uppercase tracking-widest">Error connecting to Ledger Database.</p>`;
            }
        }

        // --- 5. INITIALIZATION & LISTENERS ---
        document.getElementById('filter-sport').addEventListener('change', (e) => {
            currentSportFilter = e.target.value;
            renderLedger();
        });

        document.getElementById('filter-status').addEventListener('change', (e) => {
            currentStatusFilter = e.target.value;
            renderLedger();
        });

        window.onload = () => {
            loadAllLedgerData();
        };

    </script>
</body>
</html>
